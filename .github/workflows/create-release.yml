name: Create Release

# A convenience wrapper around the GitHub release form: it creates the tag and
# the release with auto-generated notes, nothing more.
#
# Everything else - the version bump, the changelog, the Docker images - is done
# by publish-release.yml, which reacts to the release being published. Creating
# the release by hand in the GitHub UI works exactly the same way; use whichever
# you prefer.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example: 4.0.0)"
        required: true
        type: string
      make_latest:
        description: "Mark this release as latest"
        required: true
        type: boolean
        default: true
      prerelease:
        description: "Mark as pre-release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  create-release:
    name: Tag and create the release
    runs-on: ubuntu-latest

    steps:
      - name: Check out default branch
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version format: $VERSION"
            echo "Use semver like 4.0.0 or 4.0.0-rc.1"
            exit 1
          fi

      - name: Ensure release tag does not already exist
        run: |
          TAG="v${{ inputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 1
          fi

      # The tag is created here at the head of the default branch, which is
      # where publish-release.yml requires it to be. It moves the tag onto the
      # version-bump commit afterwards.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.event.repository.default_branch }}
          generate_release_notes: true
          make_latest: ${{ inputs.make_latest && 'true' || 'false' }}
          prerelease: ${{ inputs.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
