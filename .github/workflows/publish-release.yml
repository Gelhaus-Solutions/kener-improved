name: Publish Release

# Publishing a GitHub release drives the whole release:
#
#   1. `prepare` bumps package.json/package-lock.json to the tag's version,
#      writes the release body into CHANGELOG.md and the docs changelogs,
#      commits that to the default branch, and moves the release tag onto the
#      commit so the tag, the release and the image all agree.
#   2. `publish` builds that commit and pushes :latest (+ the version tags).
#
# The release body IS the changelog, so it has to be non-empty. Write it in the
# GitHub release form, or let "Generate release notes" fill it in.
#
# Requires the default branch to accept a push from github-actions[bot]. If it
# is protected, allow that actor to bypass, or `prepare` fails at the push.

on:
  release:
    types:
      - published

env:
  GITHUB_REGISTRY: ghcr.io

# Never cancel a half-finished release: `prepare` pushes commits and moves tags.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump version and record the changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve release version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag '$TAG' is not a semver version (expected v4.2.0 or 4.2.0-rc.1)"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The bump commit goes on top of the default branch and the tag then moves
      # onto it. That is only correct if the tag is already at the branch head:
      # anywhere else and the release would silently swallow commits that were
      # never part of it.
      - name: Ensure the release tag is at the default branch head
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          TAG_SHA=$(git rev-parse "refs/tags/${TAG}^{commit}")
          HEAD_SHA=$(git rev-parse "origin/${DEFAULT_BRANCH}")

          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::tag ${TAG} points at ${TAG_SHA} but ${DEFAULT_BRANCH} is at ${HEAD_SHA}."
            echo "::error::Delete the release and its tag, then publish again from the head of ${DEFAULT_BRANCH}."
            exit 1
          fi

      # Via a file, never interpolated into the shell: the body is arbitrary
      # text from the release form.
      - name: Write the release body to a file
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          printf '%s' "$RELEASE_BODY" > "${RUNNER_TEMP}/release-notes.md"

          if [ ! -s "${RUNNER_TEMP}/release-notes.md" ]; then
            echo "::error::the release body is empty - it is the changelog, so there is nothing to record"
            exit 1
          fi

      - name: Bump version and write the changelogs
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          node scripts/apply-release.mjs \
            --version "$VERSION" \
            --date "${PUBLISHED_AT%%T*}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"

      - name: Commit, push, and move the tag
        id: commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            # A re-published release whose body did not change lands here.
            echo "nothing to commit; leaving ${TAG} where it is"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(release): v${VERSION}"
          git push origin "HEAD:${DEFAULT_BRANCH}"

          git tag -f -a "$TAG" -m "Release $TAG"
          git push --force origin "refs/tags/${TAG}"

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Summarise
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          {
            echo "### Release ${TAG}"
            echo
            echo "- version: \`$(node -p 'require("./package.json").version')\`"
            echo "- commit: \`${SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Build and push :latest${{ matrix.docs && '-w-docs' || '' }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        docs: [false, true]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the released commit
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Verify the checkout carries the released version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          PACKAGE_VERSION=$(node -p 'require("./package.json").version')

          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "::error::package.json is at ${PACKAGE_VERSION}, expected ${VERSION}"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase path segments and this org's name has them.
      - name: Compute image name
        id: image
        run: |
          echo "name=${GITHUB_REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # "" for the plain image, "-w-docs" for the one carrying the docs site.
      # A pre-release publishes its version tags but must not move :latest.
      - name: Compute tags
        id: tags
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "${{ matrix.docs }}" = "true" ]; then
            SUFFIX="-w-docs"
          else
            SUFFIX=""
          fi

          echo "suffix=${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION}${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "v_tag=v${VERSION}${SUFFIX}" >> "$GITHUB_OUTPUT"

          if [ "$PRERELEASE" = "true" ]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5.6.1
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest${{ steps.tags.outputs.suffix }},enable=${{ steps.tags.outputs.latest == 'true' }}
            type=raw,value=${{ steps.tags.outputs.version_tag }}
            type=raw,value=${{ steps.tags.outputs.v_tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.13.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VARIANT=debian
            WITH_DOCS=${{ matrix.docs }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=main-docs-${{ matrix.docs }}
          cache-to: type=gha,mode=max,scope=release-docs-${{ matrix.docs }}
