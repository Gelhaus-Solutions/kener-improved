name: Publish probe image

# The standalone probe, published as its own image.
#
# **Its own tag line, deliberately.** The probe is versioned independently of
# Kener because the thing that has to agree between them is the wire protocol,
# not the release number: `probe/src/protocol.ts` carries `v: 1` and the server
# checks it. Tying the two together would publish an identical probe image on
# every Kener release that never touched `probe/`, and would imply a coupling
# that does not exist - a v1 probe works against any server that speaks v1.
#
# Released by pushing a `probe-v*` tag:
#
#     git tag probe-v1.1.0 && git push origin probe-v1.1.0
#
# `workflow_dispatch` builds and pushes without a tag, for testing the pipeline
# or cutting an image from the branch head.

on:
  push:
    tags:
      - "probe-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.1.0). Pushes :latest as well."
        required: true
        type: string

env:
  GITHUB_REGISTRY: ghcr.io

concurrency:
  group: probe-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push the probe image
    runs-on: ubuntu-latest
    permissions:
      # `write` because the version bump is pushed back to the default branch.
      # If that branch is protected, allow github-actions[bot] to bypass, or the
      # final step fails after the image has already been published.
      contents: write
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2
        with:
          # Credentials kept: the version bump below is pushed to the default
          # branch, so the repository stops disagreeing with the image.
          fetch-depth: 0

      # The tag is the source of truth for a tag push; the input is for a manual
      # run. Validated rather than trusted: a malformed version would publish an
      # image nobody could find by the name they expected.
      - name: Resolve version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#probe-v}"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semver version (expected probe-v1.1.0 or 1.1.0-rc.1)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # A pre-release publishes its version tags and must not move :latest.
          if [[ "$VERSION" == *-* ]]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi

      # The version the probe reports to Kener and shows on the probes screen is
      # baked in from `probe/package.json` at bundle time, so it has to match the
      # tag or the screen names a version that matches no published image.
      #
      # **This used to refuse and tell the operator to go and bump it by hand.**
      # That was the wrong call: `publish-release.yml` already bumps Kener's own
      # `package.json` from the tag and commits it, so the probe demanding the
      # opposite was an inconsistency that only ever showed up as a failed
      # release. The tag is the intent; the file follows it.
      - name: Set the probe version from the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "probe/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          '
          echo "probe/package.json set to $(node -p 'require("./probe/package.json").version')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase path segments and this org's name has them. The
      # image sits beside the Kener one rather than under it, because it is a
      # separate artefact with a separate lifecycle.
      - name: Compute image name
        id: image
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "name=${GITHUB_REGISTRY}/${OWNER}/kener-probe" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5.6.1
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ steps.version.outputs.latest == 'true' }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=v${{ steps.version.outputs.version }}

      # Context is the repository root, not `probe/`: the probe imports Kener's
      # own service classes by relative path so that there is exactly one copy of
      # the check logic. See probe/Dockerfile.
      - name: Build and push
        uses: docker/build-push-action@v6.13.0
        with:
          context: .
          file: probe/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=probe
          cache-to: type=gha,mode=max,scope=probe

      # After the image is published, not before: a bump commit for a release that
      # then failed to build would leave the repository claiming a version that
      # does not exist anywhere.
      #
      # The tag is deliberately **not** moved onto this commit, unlike
      # `publish-release.yml`. That workflow moves it because the release notes,
      # the version and the image all have to describe one commit; here the only
      # thing that has to agree is the version string the image reports, and
      # force-moving a tag is a good deal more dangerous than a file being one
      # commit behind.
      - name: Record the version on the default branch
        if: success()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B probe-version-bump "origin/${DEFAULT_BRANCH}"

          node -e '
            const fs = require("fs");
            const path = "probe/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          '

          git add probe/package.json
          if git diff --cached --quiet; then
            echo "probe/package.json is already at ${VERSION}; nothing to record"
            exit 0
          fi

          git commit -m "chore(probe): v${VERSION}"
          git push origin "HEAD:${DEFAULT_BRANCH}"

      - name: Summarise
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Probe ${VERSION}"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
