name: Tests

on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs on the same branch / PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
        contents: read

    # Both audits run against a real Postgres, because both read the live
    # schema. `check-tenancy` compares the `org_id` columns the database
    # actually has against `TENANT_TABLES`, and `check-org-provisioning` walks
    # the rows every org holds. Neither can be answered from source alone, which
    # is exactly why they were never wired in and why the gaps they exist to
    # catch reached production twice.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kener_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm test

      # A production build, because `check` and `test` between them cannot see
      # this class of failure and one reached main.
      #
      # `import.meta.glob(..., { eager: true })` EXECUTES every file it matches.
      # A module that is only valid under vitest - a co-located `*.test.ts` whose
      # top level calls `vi.mock` - therefore runs inside the server bundle and
      # throws "Vitest mocker was not initialized in this environment", but only
      # here: type checking is happy, and the test suite is happy because under
      # vitest the file is exactly what it claims to be.
      #
      # publish-main.yml would eventually catch it by failing to build the image,
      # but that is after merge and it does not run on a pull request, so main
      # stays red in the meantime. This is the same gate, one step earlier.
      - name: Build
        run: npm run build

      # The migrations and seeds are the only thing that still runs from source
      # at boot, so this is also the one place CI executes them at all. A
      # migration that is not re-runnable, or a seed that imports a file the
      # build does not ship, fails here rather than in a deployment.
      - name: Migrate and seed a throwaway database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kener_ci
        run: |
          npx knex migrate:latest
          npx knex seed:run
          # Re-runnability is a property every migration in this repo claims and
          # nothing checked. A second pass must be a no-op.
          npx knex migrate:latest
          npx knex seed:run

      - name: Check tenancy registration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kener_ci
        run: npm run db:check-tenancy

      - name: Check org provisioning
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kener_ci
        run: npm run db:check-orgs

      # I10. The step above migrates an EMPTY database, which proves a fresh
      # install works and nothing about an upgrade: a migration that rewrites or
      # drops rows has nothing to rewrite or drop. This one puts configuration in
      # first, rolls the newest migration back and forward again, and then runs
      # what the app runs afterwards. Last, because it leaves a fixture behind.
      - name: Check that an upgrade preserves configuration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kener_ci
          KENER_SECRET_KEY: ci-upgrade-check-key-not-a-real-secret
        run: npm run db:check-upgrade
